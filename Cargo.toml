[package]
name = "stasis-rs"
version = "0.10.0"
edition = "2024"
description = "Durable AI orchestration framework with runtime jobs, lineage, and memory integration"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EntasisLabs/stasis"
homepage = "https://github.com/EntasisLabs/stasis"
documentation = "https://docs.rs/stasis-rs"
keywords = ["ai", "agent", "orchestration", "runtime", "workflow"]
categories = ["asynchronous", "development-tools", "web-programming"]
include = [
	"/Cargo.toml",
	"/CHANGELOG.md",
	"/README.md",
	"/LICENSE-MIT",
	"/LICENSE-APACHE",
	"/build.rs",
	"/src/**",
	"/stasis-macros/**",
	"/templates/**",
	"/dashboard_assets/static/**",
	"/dashboard_assets/styles/**",
	"/docs/README.md",
	"/docs/architecture/**",
	"/docs/adr/**",
	"/docs/v1-runtime-draft.md",
	"/docs/design/stasis-framework-rfc.md",
	"/docs/design/stasis-api-sdk-layer-design.md",
	"/docs/design/federated-job-contract.md",
	"/scripts/check-doc-metadata.sh",
	"/examples/**",
	"/tests/**",
]

[lib]
name = "stasis"

[[bin]]
name = "stasis_dashboard"
path = "src/bin/stasis_dashboard.rs"
required-features = ["dashboard"]

[workspace]
members = [".", "stasis-macros", "stasisd"]
resolver = "2"

[features]
default = ["native"]
native = [
	"dashboard",
	"surreal-native",
	"llm-genai",
	"grapheme",
	"env-fs",
	"locus-sdk/genai-provider",
	"locus-sdk/http-providers",
]
dashboard = [
	"dep:axum",
	"dep:askama",
	"dep:askama_axum",
	"dep:rust-embed",
	"grapheme",
	"surreal-native",
	"env-fs",
]
dashboard-embedded = ["dashboard"]
dashboard-lsp = ["dashboard", "grapheme", "dep:grapheme-lsp"]
surreal-native = ["dep:surrealdb", "dep:surrealdb-types"]
llm-genai = ["dep:genai", "genai/rustls-tls"]
grapheme = ["dep:grapheme-sdk", "dep:grapheme-compiler"]
grapheme-full = [
	"grapheme",
	"grapheme-sdk/full",
	"grapheme-compiler/full",
]
env-fs = ["dep:dotenvy"]
otel = [
	"dep:opentelemetry",
	"dep:opentelemetry_sdk",
	"dep:opentelemetry-otlp",
]
transport-rabbitmq = ["dep:lapin"]
transport-kafka = ["dep:rskafka"]
transport-kafka-wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
axum = { version = "0.8", optional = true }
askama = { version = "0.12", features = ["with-axum"], optional = true }
askama_axum = { version = "0.4", optional = true }
rust-embed = { version = "8", optional = true }
regex = "1"
sha2 = "0.10"
hex = "0.4"
locus-core-rs = { version = "=0.5.1", default-features = false }
locus-sdk = { version = "=0.3.1", default-features = false }
genai = { version = "0.6.5", default-features = false, optional = true }
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
grapheme-sdk = { version = "0.7.1", default-features = false, features = ["host"], optional = true }
grapheme-compiler = { version = "0.7.1", default-features = false, optional = true }
grapheme-lsp = { version = "0.7.1", optional = true, default-features = false }
futures-util = "0.3"
lapin = { version = "2", optional = true }
rskafka = { version = "0.5", optional = true }
dotenvy = { version = "0.15", optional = true }
stasis-macros = { package = "stasis-rs-macros", version = "0.1.0", path = "stasis-macros" }
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic", "metrics"], optional = true }
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "rustls", "kv-mem", "protocol-ws"], optional = true }
surrealdb-types = { version = "3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[build-dependencies]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
