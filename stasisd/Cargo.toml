[package]
name = "stasisd"
version = "0.1.0"
edition = "2024"
description = "Declarative Stasis engine — YAML/TOML desired state to durable agent schedules"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "stasisd"
path = "src/main.rs"

[dependencies]
stasis-rs = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
cron = "0.12"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
