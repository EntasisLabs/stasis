[package]
name = "stasis-demo-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Loopback OpenAI proxy + urspace mint host for the runstasis.io live demo"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/EntasisLabs/stasis"
readme = "README.md"

[lib]
name = "stasis_demo_host"
path = "src/lib.rs"

[[bin]]
name = "stasis-demo-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dashmap = "6"
dotenvy = "0.15"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urspace = { git = "https://github.com/EntasisLabs/urspace" }

[dev-dependencies]
http-body-util = "0.2"
tower = { version = "0.5", features = ["util"] }
