name: WASM compatibility

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check stasis-rs WASM kernel
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features

      - name: Check stasis-rs WASM OpenAI HTTP gateway
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features --features llm-openai-http

      - name: Check stasis-rs WASM OpenAI HTTP + Grapheme guest
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features --features llm-openai-http,grapheme

      - name: Check stasis-rs WASM HTTP adapters
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features --features http-wasm

      - name: Check stasis-rs WASM Surreal WS
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features --features surreal-ws

      - name: Check stasis-rs WASM Locus persist adapters
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features --features locus-persist

      - name: Check stasis-wasm bindings
        run: cargo check -p stasis-wasm --target wasm32-unknown-unknown

  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install matching wasm-bindgen-cli
        run: |
          version=$(awk '/name = "wasm-bindgen"$/{getline; if ($1=="version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)
          echo "wasm-bindgen crate version: $version"
          cargo install wasm-bindgen-cli --locked --version "$version"

      - name: Native in-memory smoke
        run: cargo test -p stasis-rs --test wasm_kernel_smoke

      - name: WASM in-memory smoke
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_ONLY_NODE: "1"
        run: cargo test -p stasis-rs --target wasm32-unknown-unknown --no-default-features --test wasm_kernel_smoke

      - name: Build stasis-wasm npm package
        run: npm --prefix stasis-wasm run build

      - name: Node npm package smoke
        run: npm --prefix stasis-wasm test

      - name: npm pack dry-run
        run: npm --prefix stasis-wasm run pack:dry

  native-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace
