name: WASM compatibility

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check stasis-rs WASM kernel
        run: cargo check -p stasis-rs --target wasm32-unknown-unknown --no-default-features

  native-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace
